<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="An X-wing chasing a TIE fighter in a loop through synthwave space">
  <title>Dogfight over the synthwave grid</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081c"/>
      <stop offset="0.62" stop-color="#131032"/>
      <stop offset="1" stop-color="#2b1247"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="0.45" stop-color="#ff5e8a"/>
      <stop offset="1" stop-color="#b23bd6"/>
    </linearGradient>
    <radialGradient id="dsShade" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#3b4368"/>
      <stop offset="0.7" stop-color="#262d49"/>
      <stop offset="1" stop-color="#181d33"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="sunStripes">
      <rect x="-60" y="-60" width="120" height="120" fill="#fff"/>
      <rect x="-60" y="6" width="120" height="3" fill="#000"/>
      <rect x="-60" y="16" width="120" height="4.5" fill="#000"/>
      <rect x="-60" y="28" width="120" height="6" fill="#000"/>
      <rect x="-60" y="42" width="120" height="8" fill="#000"/>
    </mask>
    <path id="orbit" d="M 190 150 a 260 72 0 1 1 520 0 a 260 72 0 1 1 -520 0"/>
    <path id="orbitFar" d="M 320 80 a 120 24 0 1 1 240 0 a 120 24 0 1 1 -240 0"/>
    <g id="starCluster">
      <circle cx="40" cy="35" r="1.2" fill="#cfe7ff"/>
      <circle cx="120" cy="90" r="0.8" fill="#ffffff"/>
      <circle cx="210" cy="28" r="1.4" fill="#ffd6f2"/>
      <circle cx="305" cy="120" r="0.9" fill="#cfe7ff"/>
      <circle cx="390" cy="55" r="1.1" fill="#ffffff"/>
      <circle cx="470" cy="150" r="0.7" fill="#cfe7ff"/>
      <circle cx="560" cy="40" r="1.3" fill="#ffffff"/>
      <circle cx="640" cy="105" r="0.8" fill="#ffd6f2"/>
      <circle cx="730" cy="66" r="1.1" fill="#cfe7ff"/>
      <circle cx="820" cy="140" r="0.9" fill="#ffffff"/>
      <circle cx="875" cy="30" r="1.2" fill="#cfe7ff"/>
      <circle cx="90" cy="170" r="0.8" fill="#ffffff"/>
      <circle cx="255" cy="185" r="1.0" fill="#cfe7ff"/>
      <circle cx="515" cy="195" r="0.8" fill="#ffd6f2"/>
      <circle cx="690" cy="180" r="1.0" fill="#ffffff"/>
    </g>
  </defs>

  <!-- ============ background ============ -->
  <rect width="900" height="300" fill="url(#sky)"/>

  <!-- parallax starfield (two drifting layers, duplicated for a seamless wrap) -->
  <g opacity="0.9">
    <g>
      <use href="#starCluster" xlink:href="#starCluster"/>
      <use href="#starCluster" xlink:href="#starCluster" x="900"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="90s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.5" transform="translate(0 12)">
      <use href="#starCluster" xlink:href="#starCluster"/>
      <use href="#starCluster" xlink:href="#starCluster" x="900"/>
      <animateTransform attributeName="transform" type="translate" from="0 12" to="-900 12" dur="150s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- twinklers -->
  <g fill="#ffffff">
    <circle cx="150" cy="60" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="90" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="130" r="1.3"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="845" cy="180" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- synthwave sun on the horizon -->
  <g transform="translate(640 238)">
    <circle r="46" fill="url(#sunGrad)" mask="url(#sunStripes)" opacity="0.85" filter="url(#bigGlow)"/>
  </g>

  <!-- horizon + retro grid -->
  <g>
    <rect x="0" y="236.5" width="900" height="2.5" fill="#ff2d95" opacity="0.55" filter="url(#glow)"/>
    <g stroke="#ff2d95" stroke-width="1" opacity="0.22">
      <line x1="0" y1="245" x2="900" y2="245"/>
      <line x1="0" y1="254" x2="900" y2="254"/>
      <line x1="0" y1="266" x2="900" y2="266"/>
      <line x1="0" y1="281" x2="900" y2="281"/>
      <line x1="640" y1="238" x2="640" y2="300"/>
      <line x1="640" y1="238" x2="520" y2="300"/>
      <line x1="640" y1="238" x2="400" y2="300"/>
      <line x1="640" y1="238" x2="230" y2="300"/>
      <line x1="640" y1="238" x2="0" y2="300"/>
      <line x1="640" y1="238" x2="760" y2="300"/>
      <line x1="640" y1="238" x2="880" y2="300"/>
      <line x1="640" y1="238" x2="900" y2="270"/>
      <line x1="640" y1="238" x2="0" y2="262"/>
    </g>
  </g>

  <!-- Death Star, lurking -->
  <g transform="translate(806 60)" opacity="0.9">
    <circle r="34" fill="url(#dsShade)"/>
    <circle cx="-12" cy="-11" r="9" fill="#1c2340" stroke="#39415f" stroke-width="1.2"/>
    <circle cx="-12" cy="-11" r="3" fill="#141a30"/>
    <path d="M -33.5 5 Q 0 12 33.5 5" fill="none" stroke="#1a2038" stroke-width="1.6"/>
  </g>

  <!-- distant background dogfight -->
  <g opacity="0.35">
    <polygon points="7,0 -5,-3 -5,3" fill="#9aa3c7">
      <animateMotion dur="17s" begin="-4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbitFar" xlink:href="#orbitFar"/>
      </animateMotion>
    </polygon>
    <polygon points="6,0 -4,-4 -4,4" fill="#7d86ad">
      <animateMotion dur="17s" begin="-2.6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbitFar" xlink:href="#orbitFar"/>
      </animateMotion>
    </polygon>
  </g>

  <!-- ============ TIE fighter (the hunted) ============ -->
  <g>
    <animateMotion dur="11s" begin="-3.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit" xlink:href="#orbit"/>
    </animateMotion>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 4; 0 0" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="2.8s" repeatCount="indefinite"/>
      <!-- solar panels -->
      <path d="M -11 -19 L -15 -17 L -15 17 L -11 19 Z" fill="#262c47" stroke="#171c30" stroke-width="0.8"/>
      <path d="M 11 -19 L 15 -17 L 15 17 L 11 19 Z" fill="#262c47" stroke="#171c30" stroke-width="0.8"/>
      <rect x="-11.5" y="-1.6" width="4" height="3.2" fill="#565f85"/>
      <rect x="7.5" y="-1.6" width="4" height="3.2" fill="#565f85"/>
      <!-- cockpit ball -->
      <circle r="8.5" fill="#3a4160" stroke="#232946" stroke-width="1"/>
      <circle r="3.6" fill="#12162b" stroke="#7df9ff" stroke-width="0.6"/>
      <!-- near miss / hit flash — 5.5s cycles offset to land during the X-wing's fire windows -->
      <g filter="url(#bigGlow)">
        <circle cx="-4" cy="2" fill="#ffd166">
          <animate attributeName="r" values="0;12;12" keyTimes="0;0.14;1" dur="5.5s" begin="-0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.95;0;0" keyTimes="0;0.22;1" dur="5.5s" begin="-0.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="3" cy="-4" fill="#ff8c42">
          <animate attributeName="r" values="0;8;8" keyTimes="0;0.12;1" dur="5.5s" begin="-3.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.2;1" dur="5.5s" begin="-3.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- ============ X-wing (the hunter) ============ -->
  <g>
    <animateMotion dur="11s" begin="-2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit" xlink:href="#orbit"/>
    </animateMotion>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 -6; 0 0" keyTimes="0;0.35;0.7;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="3.4s" repeatCount="indefinite"/>
      <!-- laser bolts: alternating quad-cannon fire from the wingtips.
           Gated to two short volleys per straightaway — cannons hold fire in the turns.
           The gate's 5.5s cycle is half the 11s orbit, aligned via the same -2s begin as the flight path. -->
      <g filter="url(#glow)">
        <animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.25;0.4;0.55;0.72" calcMode="discrete" dur="5.5s" begin="-2s" repeatCount="indefinite"/>
        <g>
          <rect x="-6" y="-20.6" width="16" height="2" rx="1" fill="#ff3b3b"/>
          <rect x="-6" y="18.6" width="16" height="2" rx="1" fill="#ff3b3b"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="0.55s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.75;1" dur="0.55s" repeatCount="indefinite"/>
        </g>
        <g>
          <rect x="-2" y="-16.8" width="14" height="1.8" rx="0.9" fill="#ff3b3b"/>
          <rect x="-2" y="15" width="14" height="1.8" rx="0.9" fill="#ff3b3b"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="0.55s" begin="-0.28s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.75;1" dur="0.55s" begin="-0.28s" repeatCount="indefinite"/>
        </g>
      </g>
      <!-- far S-foils (port side, darker) with their wingtip cannons -->
      <path d="M -3 -2.5 L -24 -16 L -27 -12 L -8 -0.5 Z" fill="#767c99" stroke="#5d6484" stroke-width="0.5"/>
      <path d="M -3 2.5 L -24 16 L -27 12 L -8 0.5 Z" fill="#6b7190" stroke="#5d6484" stroke-width="0.5"/>
      <rect x="-26" y="-15.9" width="24" height="1.1" rx="0.55" fill="#5d6484"/>
      <rect x="-26" y="14.8" width="24" height="1.1" rx="0.55" fill="#5d6484"/>
      <!-- four engine trails -->
      <g stroke-linecap="round">
        <line x1="-24" y1="-4" x2="-40" y2="-4" stroke="#7df9ff" stroke-width="1.4" opacity="0.3">
          <animate attributeName="opacity" values="0.15;0.4;0.15" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-24" y1="4" x2="-40" y2="4" stroke="#7df9ff" stroke-width="1.4" opacity="0.3">
          <animate attributeName="opacity" values="0.4;0.12;0.4" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-28" y1="-6.5" x2="-50" y2="-6.5" stroke="#7df9ff" stroke-width="2" opacity="0.5">
          <animate attributeName="opacity" values="0.25;0.65;0.25" dur="0.7s" repeatCount="indefinite"/>
        </line>
        <line x1="-28" y1="6.5" x2="-50" y2="6.5" stroke="#7df9ff" stroke-width="2" opacity="0.5">
          <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.7s" repeatCount="indefinite"/>
        </line>
      </g>
      <!-- fuselage: long nose, canopy, astromech dome -->
      <path d="M 40 0 L 14 -3.5 L -6 -4.5 L -24 -4 L -30 -2 L -30 2 L -24 4 L -6 4.5 L 14 3.5 Z" fill="#cfd4e8" stroke="#8f96b3" stroke-width="0.6"/>
      <path d="M 40 0 L 26 -2.7 L 26 2.7 Z" fill="#99a0bb"/>
      <rect x="16" y="-3.3" width="4.5" height="6.6" fill="#ff3355" opacity="0.9"/>
      <path d="M -6 -4.5 L -9 -8.5 L -16 -8.5 L -19 -4.5 Z" fill="#1c2340" stroke="#7df9ff" stroke-width="0.5"/>
      <path d="M -25.5 -4.2 a 2.6 2.6 0 0 1 5.2 0 Z" fill="#8fc1ff" stroke="#4d7fd6" stroke-width="0.5"/>
      <!-- near S-foils (starboard side, brighter) with cannons and squadron stripes -->
      <path d="M -8 -2 L -34 -20 L -37.5 -15 L -13 0 Z" fill="#b6bcd2" stroke="#7a8099" stroke-width="0.6"/>
      <path d="M -8 2 L -34 20 L -37.5 15 L -13 0 Z" fill="#a6acc4" stroke="#7a8099" stroke-width="0.6"/>
      <path d="M -22 -12 L -28 -16 L -29.8 -13.4 L -23.6 -9.6 Z" fill="#ff3355"/>
      <path d="M -22 12 L -28 16 L -29.8 13.4 L -23.6 9.6 Z" fill="#ff3355"/>
      <rect x="-36" y="-19.9" width="30" height="1.4" rx="0.7" fill="#99a0bb"/>
      <rect x="-36" y="18.5" width="30" height="1.4" rx="0.7" fill="#99a0bb"/>
      <rect x="-8.5" y="-20.3" width="2.6" height="2.2" fill="#ff3355"/>
      <rect x="-8.5" y="18.1" width="2.6" height="2.2" fill="#ff3355"/>
      <!-- engine exhausts -->
      <circle cx="-27" cy="-6.5" r="2.4" fill="#7df9ff" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-27" cy="6.5" r="2.4" fill="#7df9ff" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.55;1" dur="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- terminal caption -->
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5">
    <text x="20" y="288" fill="#9be8ff" opacity="0.85">vinnie@stockholm ~ % swift run dogfight --synthwave</text>
    <rect x="403" y="277" width="8" height="13" fill="#9be8ff">
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
