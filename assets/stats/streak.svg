<svg xmlns="http://www.w3.org/2000/svg" width="495" height="172" viewBox="0 0 495 172" role="img" aria-label="🎹 Contribution Streak">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0620"/><stop offset="1" stop-color="#1c0f38"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="171" rx="8" fill="url(#bg)" stroke="#ff2d95" stroke-opacity="0.45"/>
  <g stroke="#ff2d95" stroke-opacity="0.10">
    <line x1="0" y1="154" x2="495" y2="154"/>
    <line x1="0" y1="163" x2="495" y2="163"/>
  </g>
  <text x="20" y="30" font-family="'Segoe UI', -apple-system, Ubuntu, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ff2d95" filter="url(#glow)">🎹 Contribution Streak</text>
  
  <g font-family="'Segoe UI', -apple-system, Ubuntu, Helvetica, sans-serif" text-anchor="middle">
    
    <text x="82" y="96" font-size="26" font-weight="800" fill="#7df9ff" >1,712</text>
    <text x="82" y="124" font-size="13" font-weight="700" fill="#e6edf3">Total Contributions</text>
    <text x="82" y="144" font-size="11" fill="#8b93b8">Jan 14, 2018 — Present</text>
  </g><g font-family="'Segoe UI', -apple-system, Ubuntu, Helvetica, sans-serif" text-anchor="middle">
    <circle cx="247" cy="88" r="40" fill="none" stroke="#ff2d95" stroke-width="4" stroke-opacity="0.9" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="247" y="96" font-size="26" font-weight="800" fill="#e6edf3" filter="url(#glow)">1 🔥</text>
    <text x="247" y="124" font-size="13" font-weight="700" fill="#e6edf3">Current Streak</text>
    <text x="247" y="144" font-size="11" fill="#8b93b8">Jul 6, 2026 — Jul 6, 2026</text>
  </g><g font-family="'Segoe UI', -apple-system, Ubuntu, Helvetica, sans-serif" text-anchor="middle">
    
    <text x="412" y="96" font-size="26" font-weight="800" fill="#7df9ff" >9</text>
    <text x="412" y="124" font-size="13" font-weight="700" fill="#e6edf3">Longest Streak</text>
    <text x="412" y="144" font-size="11" fill="#8b93b8">May 30, 2025 — Jun 7, 2025</text>
  </g><g stroke="#ff2d95" stroke-opacity="0.25"><line x1="165" y1="52" x2="165" y2="150"/><line x1="330" y1="52" x2="330" y2="150"/></g>
</svg>