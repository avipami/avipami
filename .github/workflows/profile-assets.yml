name: Generate profile assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: avipami
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # Stats cards are intentionally NOT generated here: they include private
      # repo data, so they are produced locally via scripts/update-stats.sh
      # (committed to assets/stats/) and no token is ever stored in the cloud.

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
